<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maaya Kids Castle, Annur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5B3FA8; --sun:#F5B82E; --mint:#2FA58A; --rose:#E0577A;
  --bg:#F3F1FA; --surface:#FFFFFF; --surface-2:#EDE9F7; --ink:#231C3D; --muted:#655E80; --line:#DCD6EC;
  --brand-ink:#FFFFFF; --ok-bg:#E2F5EF; --bad-bg:#FCE6EC; --wa:#E7F8EC; --wa-ink:#123B22;
  --display:"Baloo Thambi 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans","Baloo Thambi 2",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17132A; --surface:#221C3B; --surface-2:#2C2549; --ink:#EEEAFB; --muted:#ADA6C8; --line:#3A3260;
  --ok-bg:#163A31; --bad-bg:#45202D; --wa:#16301F; --wa-ink:#D6F5DF; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#17132A; --surface:#221C3B; --surface-2:#2C2549; --ink:#EEEAFB; --muted:#ADA6C8; --line:#3A3260;
  --ok-bg:#163A31; --bad-bg:#45202D; --wa:#16301F; --wa-ink:#D6F5DF; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h2{font-size:1.75rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
a{color:var(--brand)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}

/* Header: the castle banner is the one bold moment */
.top{background:var(--brand);color:var(--brand-ink);position:relative;overflow:hidden}
.top-inner{max-width:1120px;margin:0 auto;padding:18px 20px 0;display:flex;align-items:center;gap:14px}
.crest{width:58px;height:58px;flex:none}
.brand-name{font-family:var(--display);font-weight:800;font-size:clamp(1.4rem,3.4vw,2.1rem);letter-spacing:-.01em}
.brand-place{opacity:.85;font-size:.95rem;margin-top:-2px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{border:1.5px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.pill:hover{background:rgba(255,255,255,.14)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--sun);color:#2A1E00;font-size:.75rem;font-weight:800;margin-left:4px;text-align:center}
.battlement{display:block;width:100%;height:18px;margin-top:14px}
.tabs{max-width:1120px;margin:0 auto;display:flex;gap:4px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;text-decoration:none;color:var(--muted);font-weight:700;padding:12px 10px 10px;border-bottom:3px solid transparent;font-size:.95rem}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brand)}
.tabwrap{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}

main{max-width:1120px;margin:0 auto;padding:24px 20px 80px}
.head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.panel+.panel{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:2rem;line-height:1.1}
.stat span{color:var(--muted);font-size:.92rem}
.stat.sun{border-top:6px solid var(--sun)} .stat.mint{border-top:6px solid var(--mint)} .stat.rose{border-top:6px solid var(--rose)} .stat.brand{border-top:6px solid var(--brand)}
label.f{display:block;font-weight:700;font-size:.9rem;margin:12px 0 4px}
.in{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
textarea.in{min-height:96px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 160px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.who{flex:1;min-width:0}
.who small{display:block;color:var(--muted)}
.pa{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.pa button{border:0;background:transparent;padding:6px 14px;font-weight:800;cursor:pointer;color:var(--muted)}
.pa button[aria-pressed="true"].p{background:var(--mint);color:#fff}
.pa button[aria-pressed="true"].a{background:var(--rose);color:#fff}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--surface-2)}
.tag.ok{background:var(--ok-bg)} .tag.bad{background:var(--bad-bg)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.bar{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--mint)}
.empty{color:var(--muted);padding:18px 0}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.8rem;color:var(--muted);font-weight:700;text-align:center}
.day{min-height:84px;border:1px solid var(--line);border-radius:12px;padding:6px;background:var(--surface);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{opacity:.4}
.day.today{border:2px solid var(--brand)}
.day .n{font-weight:800;font-size:.85rem}
.ev{font-size:.72rem;border-radius:6px;padding:1px 5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend{display:flex;gap:14px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
@media (max-width:640px){.day{min-height:56px}.ev{font-size:0;height:6px;padding:0}}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(20,14,40,.45);z-index:20;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .msgs{flex:1;overflow:auto;padding:16px;background:var(--surface-2)}
.bubble{background:var(--wa);color:var(--wa-ink);border-radius:14px 14px 4px 14px;padding:10px 12px;margin:0 0 12px auto;max-width:92%;white-space:pre-wrap;font-size:.94rem}
.bubble .meta{font-size:.76rem;opacity:.75;margin-bottom:4px;font-weight:700;white-space:normal}
.bubble a{font-size:.82rem;font-weight:700;color:inherit}
.modal{position:fixed;inset:0;display:none;place-items:center;z-index:30;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--surface);border-radius:20px;padding:20px;width:min(480px,100%);max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

/* Assistant chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:280px;max-height:420px;overflow:auto;padding:14px;background:var(--surface-2);border-radius:14px}
.q,.ans{max-width:80%;padding:9px 12px;border-radius:14px;white-space:pre-wrap}
.q{align-self:flex-end;background:var(--wa);color:var(--wa-ink);border-bottom-right-radius:4px}
.ans{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.ans small{display:block;color:var(--muted);font-weight:700;font-size:.75rem}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.login{max-width:880px;margin:0 auto;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kid{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--sun);color:#2A1E00;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;flex:none}
a.stat{text-decoration:none;color:inherit}
.sync{font-size:.8rem;opacity:.85;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="top-inner">

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>

function answer(q){
  const s=S.settings,x=q.toLowerCase(),td=today(),has=(...w)=>w.some(k=>x.includes(k));
  if(has("hi","hello","vanakkam","வணக்கம்","hey"))return `Vanakkam! Welcome to ${sch()}. Ask me about admissions, fees, timings, holidays or events.`;
  if(has("admission","admit","join","seat","enrol","enroll","சேர்க்கை"))return s.admissions?`Admissions are open for ${CLASSES.join(", ")}. Age groups: ${s.ages}. Share your name and child’s age and the office will call you to book a school visit.`:"Admissions are closed for now. Leave your number and we’ll tell you when they open.";
  if(has("age","old","years"))return `Age groups: ${s.ages}.`;
  if(has("fee","fees","price","cost","amount","கட்டணம்"))return `Current fees: ${S.fees.filter(f=>f.target==="all").map(f=>`${f.title} ${money(f.amount)}`).join(", ")||"the office will share the fee sheet"}. For a full fee sheet for your child’s class, the office will message you on WhatsApp.`;
  if(has("time","timing","hours","when does","நேரம்"))return `School hours are ${s.timings}.`;
  if(has("holiday","leave","closed","விடுமுறை")){const h=S.events.filter(e=>e.type==="holiday"&&(e.end||e.start)>=td).sort((a,b)=>a.start.localeCompare(b.start));return h.length?"Upcoming holidays: "+h.slice(0,3).map(e=>`${e.title} on ${nice(e.start)}${e.end?" to "+nice(e.end):""}`).join("; ")+".":"No holidays are scheduled right now."}
  if(has("event","function","day","programme","program","meeting")){const e=S.events.filter(e=>e.type==="event"&&e.start>=td).sort((a,b)=>a.start.localeCompare(b.start));return e.length?"Coming up: "+e.slice(0,3).map(v=>`${v.title} on ${nice(v.start)}`).join("; ")+".":"No events are planned right now."}
  if(has("where","address","location","place","map"))return `We’re at ${s.address}.`;
  if(has("phone","contact","call","number"))return s.phone?`You can call the school on ${s.phone}.`:"The office will call you back. Please share your number.";
  if(has("van","transport","bus","pickup"))return "Van service is available on select routes. Share your area and the office will confirm.";
  const me=myKids()[0];S.leads.unshift({id:uid(),name:me?me.parent:"Parent (assistant chat)",phone:me?me.phone:"",child:me?me.name:"-",cls:me?me.cls:"-",status:"New",source:"AI assistant",at:td,note:q});save();
  return "I’ve passed your question to the school office. Someone will get back to you shortly.";
}

const kidPosts=k=>S.posts.filter(p=>p.cls===k.cls||p.cls==="all");
const kidFees=k=>S.fees.filter(f=>feeKids(f).some(s=>s.id===k.id));
const kidNotices=k=>S.broadcasts.filter(b=>b.aud!=="staff"&&(!b.aud||b.aud==="all"||b.aud===k.cls));
function kidHead(){const k=child(),ks=myKids();return `<div class="panel kid" style="margin-bottom:18px"><div class="avatar">${esc(k.name[0])}</div><div class="who"><b style="font-family:var(--display);font-size:1.3rem">${esc(k.name)}</b><small>${esc(k.cls)}, ${esc(sch())}</small></div>${ks.length>1?`<select class="in" id="kidSel" style="width:auto" aria-label="Child">${ks.map(x=>`<option value="${x.id}" ${x.id===k.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}</div>`}
const kidBind=()=>{const s=$("#kidSel");if(s)s.onchange=()=>{ui.child=s.value;render()}};
PV.home=()=>{const k=child(),td=today(),a=(S.attendance[td+"|"+k.cls]||{})[k.id],fees=kidFees(k).filter(f=>!paid(f,k)),hw=kidPosts(k)[0],ev=S.events.filter(e=>(e.end||e.start)>=td).sort((x,y)=>x.start.localeCompare(y.start))[0],nt=kidNotices(k)[0];
 return kidHead()+`<div class="grid g4">
 <a class="stat ${a==="A"?"rose":"mint"}" href="#attendance"><b style="font-size:1.45rem;padding:4px 0">${a==="P"?t("present"):a==="A"?t("absent"):t("notMarked")}</b><span>Today, ${nice(td)}</span></a>
 <a class="stat sun" href="#fees"><b>${money(fees.reduce((n,f)=>n+f.amount,0))}</b><span>${fees.length?esc(t("due")+": "+fees.map(f=>f.title).join(", ")):"All fees paid"}</span></a>
 <a class="stat brand" href="#calendar"><b style="font-size:1.25rem;padding:6px 0">${ev?esc(ev.title):"Nothing planned"}</b><span>${ev?nice(ev.start):"Check the calendar later"}</span></a></div>
 <div class="grid g2" style="margin-top:16px"><div class="panel"><h3>${hw?(hw.kind==="homework"?t("homework"):t("classwork")):t("homework")}</h3>${hw?`<p style="white-space:pre-wrap">${esc(hw.text)}</p><p class="sub">${nice(hw.at)}</p>`:`<p class="empty">Nothing posted yet.</p>`}</div>
 <div class="panel"><h3>${t("notices")}</h3>${nt?`<p style="white-space:pre-wrap">${esc(nt.text)}</p><p class="sub">${esc(nt.at)}</p>`:`<p class="empty">No notices yet.</p>`}</div></div>`};
PV.attendance=()=>{const k=child(),r=kidAtt(k),m=today().slice(0,7),mm=r.filter(x=>x.d.startsWith(m));
 return kidHead()+head(t("attendance"),"")+`<div class="grid g4"><div class="stat mint"><b>${mm.filter(x=>x.s==="P").length}</b><span>Days present this month</span></div><div class="stat rose"><b>${mm.filter(x=>x.s==="A").length}</b><span>Days absent this month</span></div></div>
 <div class="panel" style="margin-top:16px"><ul class="list">${r.map(x=>`<li><div class="who">${nice(x.d)}</div><span class="tag ${x.s==="P"?"ok":"bad"}">${x.s==="P"?t("present"):t("absent")}</span></li>`).join("")||`<li class="empty">Attendance shows up here once the class teacher marks it.</li>`}</ul></div>`};
PV.homework=()=>{const k=child();return kidHead()+head(t("homework"),"Homework and classwork from "+esc(k.cls)+".")+`<div class="panel"><ul class="list">${kidPosts(k).map(p=>`<li><div class="who" style="white-space:pre-wrap">${esc(p.text)}<small>${nice(p.at)}</small></div><span class="tag">${p.kind==="homework"?t("homework"):t("classwork")}</span></li>`).join("")||`<li class="empty">Nothing posted yet.</li>`}</ul></div>`};
PV.fees=()=>{const k=child(),fs=kidFees(k);return kidHead()+head(t("fees"),"Pay at the school office. Your receipt comes on WhatsApp and shows here.")+`<div class="panel"><ul class="list">${fs.map(f=>{const p=S.payments.find(x=>x.fid===f.id&&x.sid===k.id);return `<li><div class="who">${esc(f.title)}<small>${money(f.amount)}, ${p?"paid on "+nice(p.at):"due "+nice(f.due)}</small></div><span class="tag ${p?"ok":"bad"}">${p?t("paid"):t("due")}</span></li>`}).join("")||`<li class="empty">No fees yet.</li>`}</ul></div>`};
PV.notices=()=>{const k=child();return kidHead()+head(t("notices"),"Messages from the school.")+`<div class="panel"><ul class="list">${kidNotices(k).map(b=>`<li><div class="who" style="white-space:pre-wrap">${esc(b.text)}<small>${esc(b.at)}</small></div></li>`).join("")||`<li class="empty">No notices yet.</li>`}</ul></div>`};
PV.calendar=()=>kidHead()+V.calendar(true);
PV.assistant=()=>V.assistant();
["home","attendance","homework","fees","notices"].forEach(r=>PV[r].bind=kidBind);
PV.calendar.bind=()=>{kidBind();V.calendar.bind(true)};
PV.assistant.bind=()=>V.assistant.bind();
const label=r=>t(r==="school-profile"?"profile":r);
function applyBrand(c){document.documentElement.style.setProperty("--brand",c)}
function chrome(){
  applyBrand(S.settings.brand);$("#schoolName").textContent=S.settings.name;$("#schoolPlace").textContent=S.settings.place;
  document.title=`${S.settings.name}, ${S.settings.place}`;$("#langBtn").textContent=S.lang==="ta"?"English":"தமிழ்";
  document.documentElement.lang=S.lang;$("#outBtn").hidden=!SES||isParent();$("#logoutBtn").hidden=!SES;document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
}
function route(){const h=location.hash.slice(1),l=isParent()?PROUTES:ROUTES;return l.includes(h)?h:l[0]}
function render(){
  if(!SES||(isParent()&&!myKids().length)){if(SES)setSes(null);chrome();$("#tabs").innerHTML="";$("#view").innerHTML=loginView();loginBind();return}
  const r=route(),l=isParent()?PROUTES:ROUTES,M=isParent()?PV:V;
  $("#tabs").innerHTML=l.map(x=>`<a href="#${x}" ${x===r?'aria-current="page"':""}>${label(x)}</a>`).join("");
  $("#view").innerHTML=M[r]();M[r].bind();
  document.querySelectorAll("[data-cls]").forEach(a=>a.addEventListener("click",()=>{ui.attCls=a.dataset.cls}));
  const cur=$("#tabs [aria-current]");cur&&cur.scrollIntoView({block:"nearest",inline:"nearest"});
}
$("#logoutBtn").onclick=()=>{setSes(null);ui.child=null;ui.chat=[];history.replaceState(null,"","#");refresh(true)};
$("#langBtn").onclick=()=>{S.lang=S.lang==="ta"?"en":"ta";save();chrome();drawOut();render()};
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
chrome();drawOut();render();
</script>
</body>
</html>
